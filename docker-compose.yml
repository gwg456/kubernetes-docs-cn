version: '3.8'

services:
  flask-oidc-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - HOST=0.0.0.0
      - PORT=5000
      - OIDC_OPENID_REALM=${OIDC_OPENID_REALM:-flask-oidc-api}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./client_secrets.json:/app/client_secrets.json:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加Redis用于session存储
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # 可选：添加Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - flask-oidc-api
    restart: unless-stopped

volumes:
  redis_data:
  logs: